---
name: Deploy Website
description: Deploy jekyll website to GitHub Pages

inputs:
  github-token:
    description: GitHub token
    required: true

  ruby-version:
    description: Ruby version
    required: true

runs:
  using: composite
  steps:
    - name: Checkout source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: true

    - name: Set up Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true

    - name: Find parent directory
      id: find-parent-directory
      shell: bash
      run: >-
        echo "parent-directory=$(dirname "$BUNDLE_GEMFILE")" >> "$GITHUB_OUTPUT"

    - name: Install and Build
      shell: bash
      working-directory: >-
        ${{ steps.find-parent-directory.outputs.parent-directory }}
      env:
        JEKYLL_ENV: production
        JEKYLL_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bundle exec jekyll build

    - name: Deploy
      if: github.ref == 'refs/heads/main'
      # yamllint disable-line rule:line-length
      uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4
      with:
        github_token: ${{ inputs.github-token }}
        publish_dir: >-
          ${{ steps.find-parent-directory.outputs.parent-directory }}/_site
        publish_branch: gh-pages
        user_name: github-actions[bot]
        user_email: github-actions[bot]@users.noreply.github.com
