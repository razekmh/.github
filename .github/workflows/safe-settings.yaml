---
name: Safe Settings Sync
on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
  schedule:
    - cron: 0 */4 * * *
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report what would change without applying it
        type: boolean
        default: true

concurrency:
  cancel-in-progress: true
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  safe-settings-sync:
    # skip (instead of failing) until the GitHub App is set up
    if: vars.SAFE_SETTINGS_APP_ID != ''
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      SAFE_SETTINGS_VERSION: 3.0.0
      SAFE_SETTINGS_CODE_DIR: .safe-settings-code
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout GitHub Safe-Settings repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.SAFE_SETTINGS_CODE_DIR }}
          persist-credentials: false
          ref: ${{ env.SAFE_SETTINGS_VERSION }}
          repository: github-community-projects/safe-settings

      - name: Setup Node.js
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache-dependency-path:
            ${{ env.SAFE_SETTINGS_CODE_DIR }}/package-lock.json
          cache: npm
          node-version-file: ${{ env.SAFE_SETTINGS_CODE_DIR }}/.nvmrc

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}

      - name: Run application
        run: npm run full-sync
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
        env:
          ADMIN_REPO: .github
          APP_ID: ${{ vars.SAFE_SETTINGS_APP_ID }}
          BLOCK_REPO_RENAME_BY_HUMAN: false
          CONFIG_PATH: safe-settings
          DEPLOYMENT_CONFIG_FILE:
            ${{ github.workspace }}/safe-settings/deployment.yaml
          ENABLE_PR_COMMENT: true
          # dry run on pull requests and (by default) manual runs; push to main
          # and the schedule apply. Settings/rulesets are read from main even
          # on a PR, so a PR run only previews main's config, not the PR's.
          FULL_SYNC_NOP:
            ${{ github.event_name == 'pull_request' || (github.event_name ==
            'workflow_dispatch' && inputs.dry-run) }}
          GH_ORG: ${{ vars.SAFE_SETTINGS_GH_ORG }}
          GITHUB_CLIENT_ID: ${{ vars.SAFE_SETTINGS_GITHUB_CLIENT_ID }}
          # yamllint disable rule:line-length
          # prettier-ignore
          GITHUB_CLIENT_SECRET: ${{ secrets.SAFE_SETTINGS_GITHUB_CLIENT_SECRET }} # zizmor: ignore[secrets-outside-env]
          LOG_LEVEL: trace
          PRIVATE_KEY: ${{ secrets.SAFE_SETTINGS_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          # yamllint enable rule:line-length
          SETTINGS_FILE_PATH: account.yaml
