# https://github.com/github-community-projects/safe-settings/blob/main-enterprise/docs/sample-settings/suborg.yml
---
suborgrepos:
  - "*"

rulesets:
  - name: Default
    target: branch
    enforcement: active

    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []

    rules:
      - type: deletion
      - type: non_fast_forward # prevents force pushes

  # release tags only: tags.yaml force-moves the floating major tag (e.g. v0)
  - name: Release tags
    target: tag
    enforcement: active

    conditions:
      ref_name:
        include:
          - refs/tags/v*.*.*
        exclude: []

    rules:
      - type: deletion
      - type: non_fast_forward # prevents force pushes
