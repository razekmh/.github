---
name: Bump Version Tag

on:
  push:
    branches:
      - main
    paths:
      - "**/*"
      - "!**/*.json5"
      - "!**/*.md"
      - "!**/*.txt"
      - "!.github/**"
      - "!.gitignore"
      - "!.pre-commit-config.yaml"
      - "!pyproject.toml"
  workflow_dispatch:

jobs:
  tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Bump version and push tag
        id: bump-version
        # yamllint disable-line rule:line-length
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true

      - name: Extract major tag
        id: extract-major
        env:
          NEW_TAG: ${{ steps.bump-version.outputs.new_tag }}
        run: >-
          echo major_tag="$(echo "$NEW_TAG" | cut -d'.' -f1)" >>
          "$GITHUB_OUTPUT"

      # this is done manually as need a non-annotated tag
      # TODO: replace with https://github.com/actions/publish-action
      - name: Update major tag
        env:
          MAJOR_TAG: ${{ steps.extract-major.outputs.major_tag }}
          NEW_TAG: ${{ steps.bump-version.outputs.new_tag }}
        run: >-
          git config user.name github-actions; git config user.email
          github-actions@github.com; git tag --force "$MAJOR_TAG" "$NEW_TAG";
          git push origin "$MAJOR_TAG" --force
