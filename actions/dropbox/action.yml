---
name: Dropbox
description: Upload files to Dropbox

inputs:
  configfile-version:
    description: Dropbox app config version
    required: true

  files-to-upload:
    description: A list of files to upload to dropbox
    required: true

  oauth-app-key:
    description: Dropbox app OAuth key
    required: true

  oauth-app-secret:
    description: Dropbox app OAuth secret
    required: true

  oauth-refresh-token:
    description: Dropbox app OAuth refresh token
    required: true

runs:
  using: composite
  steps:
    - name: Set up Dropbox
      shell: bash
      env:
        CONFIGFILE_VERSION: ${{ inputs.configfile-version }}
        OAUTH_APP_KEY: ${{ inputs.oauth-app-key }}
        OAUTH_APP_SECRET: ${{ inputs.oauth-app-secret }}
        OAUTH_REFRESH_TOKEN: ${{ inputs.oauth-refresh-token }}
      run: >-
        {
          echo "CONFIGFILE_VERSION=$CONFIGFILE_VERSION";
          echo "OAUTH_APP_KEY=$OAUTH_APP_KEY";
          echo "OAUTH_APP_SECRET=$OAUTH_APP_SECRET";
          echo "OAUTH_REFRESH_TOKEN=$OAUTH_REFRESH_TOKEN";
        } > ~/.dropbox_uploader

    - name: Retrieve Dropbox uploader script
      shell: bash
      run: >-
        curl
        https://raw.githubusercontent.com/andreafabrizi/Dropbox-Uploader/master/dropbox_uploader.sh
        -o dropbox_uploader.sh; chmod +x dropbox_uploader.sh

    - name: Upload PDF
      shell: bash
      env:
        FILES_TO_UPLOAD: ${{ inputs.files-to-upload }}
      # FILES_TO_UPLOAD is deliberately unquoted in the loop: it is a
      # whitespace-separated list
      run: >-
        for file in $FILES_TO_UPLOAD; do echo "$file"; ./dropbox_uploader.sh
        upload "$file" "$file"; done
