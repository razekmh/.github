---
name: Vale
description: Runs vale over all files in the repo

inputs:
  github-token:
    description: GitHub token
    required: true

  min-alert-level:
    description: >-
      Lowest Vale severity reported and failed on (suggestion, warning, error)
    default: error

  reporter:
    description: >-
      reviewdog reporter (github-check works on push and pull_request events)
    default: github-check

  vale-flags:
    description: Extra flags to pass to vale
    default: ""

  vale-version:
    description: Vale CLI version to install
    default: 3.26.0

runs:
  using: composite
  steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # filter in Vale itself: reviewdog hard-fails above 10 annotations per
    # step whatever their severity, so only alerts at min-alert-level and
    # above are passed on (and fail the job)
    - name: Run Vale
      # yamllint disable-line rule:line-length
      uses: vale-cli/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2.1.2
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        fail_on_error: true
        filter_mode: nofilter
        reporter: ${{ inputs.reporter }}
        vale_flags:
          --minAlertLevel=${{ inputs.min-alert-level }} ${{ inputs.vale-flags }}
        version: ${{ inputs.vale-version }}
