---
name: Deploy Quarto
description: Deploy quarto website to GitHub Pages

inputs:
  github-token:
    description: GitHub token
    required: true

  requirements-txt:
    description: Path of requirements.txt
    default: ""

  quarto-version:
    description: Quarto version to install (e.g. 1.11.9); "release" for latest
    default: release

runs:
  using: composite
  steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true

    - name: Cache Jupyter
      if: inputs.requirements-txt
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .jupyter_cache
        key:
          quarto-${{ runner.os }}-${{ hashFiles('_quarto.yml', '_quarto.yaml',
          inputs.requirements-txt) }}
        restore-keys: |
          quarto-${{ runner.os }}-

    - name: Set up uv
      if: inputs.requirements-txt
      uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7
      with:
        activate-environment: true

    - name: Install dependencies
      if: inputs.requirements-txt
      shell: bash
      env:
        REQUIREMENTS_TXT: ${{ inputs.requirements-txt }}
      run: uv pip install -r "$REQUIREMENTS_TXT"

    - name: Set up Quarto
      # yamllint disable-line rule:line-length
      uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
      with:
        version: ${{ inputs.quarto-version }}

    - name: Render ${{ github.ref_name }} branch
      if: github.ref != 'refs/heads/main'
      # yamllint disable-line rule:line-length
      uses: quarto-dev/quarto-actions/render@8a96df13519ee81fd526f2dfca5962811136661b # v2

    - name: Publish main branch
      if: github.ref == 'refs/heads/main'
      # yamllint disable-line rule:line-length
      uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b # v2
      with:
        target: gh-pages
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
